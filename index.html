
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(var(--color-primary) / <alpha-value>)',
                        onPrimary: 'rgb(var(--color-on-primary) / <alpha-value>)',
                        secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
                        surface: 'rgb(var(--color-surface) / <alpha-value>)',
                        onSurface: 'rgb(var(--color-on-surface) / <alpha-value>)',
                        background: 'rgb(var(--color-background) / <alpha-value>)',
                        surfaceVariant: 'rgb(var(--color-surface-variant) / <alpha-value>)',
                    },
                    borderRadius: {
                        'xl': '16px',
                        '2xl': '24px',
                        '3xl': '32px',
                    },
                    keyframes: {
                        'pop-up-start': {
                            '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        'scale-in': {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        'slide-up': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'pop-up-start': 'pop-up-start 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-in': 'scale-in 0.2s ease-out forwards',
                        'slide-up': 'slide-up 0.3s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: 103 80 164;
            --color-on-primary: 255 255 255;
            --color-secondary: 98 91 113;
            --color-surface: 255 251 254;
            --color-on-surface: 28 27 31;
            --color-background: 255 251 254;
            --color-surface-variant: 231 224 236;
        }
        body {
            background-color: rgb(var(--color-background));
            color: rgb(var(--color-on-surface));
            overflow: hidden; /* Prevent body scroll, let OS handle it */
            touch-action: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.3);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
